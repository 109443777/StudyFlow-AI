version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: studyflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: studyflow_ai
      MYSQL_USER: studyflow
      MYSQL_PASSWORD: studyflow123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.2
    container_name: studyflow-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis123456
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: studyflow-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: studyflow
      RABBITMQ_DEFAULT_PASS: studyflow123
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: minio/minio:RELEASE.2024-10-29T16-01-48Z
    container_name: studyflow-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: studyflow
      MINIO_ROOT_PASSWORD: studyflow123
      TZ: Asia/Shanghai
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  minio_data:
