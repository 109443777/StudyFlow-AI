server:
  port: 8080

spring:
  application:
    name: studyflow-ai-backend
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:studyflow_ai}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:studyflow}
    password: ${MYSQL_PASSWORD:studyflow123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123456}
      database: ${REDIS_DATABASE:0}
      timeout: 5s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:studyflow}
    password: ${RABBITMQ_PASSWORD:studyflow123}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 2s
          max-attempts: 3
          max-interval: 10s
          multiplier: 2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      id-type: assign_id
      update-strategy: not_null

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

studyflow:
  jwt:
    secret: ${JWT_SECRET:studyflow-ai-super-secret-key-for-jwt-token-2026}
    expire-seconds: ${JWT_EXPIRE_SECONDS:604800}
    header-name: ${JWT_HEADER_NAME:Authorization}
    token-prefix: ${JWT_TOKEN_PREFIX:Bearer }
  upload:
    session-expire-hours: ${UPLOAD_SESSION_EXPIRE_HOURS:24}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:studyflow}
    secret-key: ${MINIO_SECRET_KEY:studyflow123}
    bucket-name: ${MINIO_BUCKET:studyflow}
  langchain4j:
    chat-model: ${AI_CHAT_MODEL:}
    embedding-model: ${AI_EMBEDDING_MODEL:}
    embedding-batch-size: ${AI_EMBEDDING_BATCH_SIZE:10}
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:}
    timeout: ${AI_TIMEOUT:30s}
    max-retries: ${AI_MAX_RETRIES:2}
    log-requests: ${AI_LOG_REQUESTS:false}
    log-responses: ${AI_LOG_RESPONSES:false}
  ai:
    provider: ${STUDYFLOW_AI_PROVIDER:mock}
    external:
      base-url: ${STUDYFLOW_AI_BASE_URL:}
      api-key: ${STUDYFLOW_AI_API_KEY:}
      model: ${STUDYFLOW_AI_MODEL:}
  embedding:
    provider: ${STUDYFLOW_EMBEDDING_PROVIDER:mock}
    mock-dimension: ${STUDYFLOW_EMBEDDING_DIMENSION:64}
    external:
      base-url: ${STUDYFLOW_EMBEDDING_BASE_URL:}
      api-key: ${STUDYFLOW_EMBEDDING_API_KEY:}
      model: ${STUDYFLOW_EMBEDDING_MODEL:}
  rag:
    chunk-size: ${STUDYFLOW_RAG_CHUNK_SIZE:800}
    chunk-overlap: ${STUDYFLOW_RAG_CHUNK_OVERLAP:120}
    top-k: ${STUDYFLOW_RAG_TOP_K:4}
    history-size: ${STUDYFLOW_RAG_HISTORY_SIZE:6}
  vector-store:
    provider: ${STUDYFLOW_VECTOR_STORE_PROVIDER:milvus}
    fallback-to-database: ${STUDYFLOW_VECTOR_STORE_FALLBACK_TO_DATABASE:true}
    milvus:
      uri: ${MILVUS_URI:http://localhost:19530}
      token: ${MILVUS_TOKEN:}
      collection-name: ${MILVUS_COLLECTION_NAME:studyflow_material_chunks}
      dimension: ${MILVUS_DIMENSION:1024}
      metric-type: ${MILVUS_METRIC_TYPE:COSINE}
      batch-size: ${MILVUS_BATCH_SIZE:64}
  transcription:
    provider: ${TRANSCRIPTION_PROVIDER:mock}
    mock-prefix: ${TRANSCRIPTION_MOCK_PREFIX:[Mock Transcript]}
    ffmpeg-path: ${TRANSCRIPTION_FFMPEG_PATH:ffmpeg}
    temp-dir: ${TRANSCRIPTION_TEMP_DIR:${java.io.tmpdir}/studyflow-media}
    ffmpeg-timeout-seconds: ${TRANSCRIPTION_FFMPEG_TIMEOUT_SECONDS:600}
    external:
      base-url: ${TRANSCRIPTION_BASE_URL:}
      api-key: ${TRANSCRIPTION_API_KEY:}
      model: ${TRANSCRIPTION_MODEL:paraformer-v2}
      poll-interval-millis: ${TRANSCRIPTION_POLL_INTERVAL_MILLIS:1000}
      max-poll-attempts: ${TRANSCRIPTION_MAX_POLL_ATTEMPTS:60}

logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
    com.studyflow.ai: INFO
