spring:
  datasource:
    url: jdbc:h2:mem:studyflow_ai;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:sql/001_user.sql
        - classpath:sql/002_material.sql
        - classpath:sql/003_upload_session.sql
        - classpath:sql/004_parse_task.sql
        - classpath:sql/005_material_content.sql
        - classpath:sql/006_media_transcript.sql
        - classpath:sql/007_material_summary.sql
        - classpath:sql/008_material_chunk.sql
        - classpath:sql/009_qa_session.sql
        - classpath:sql/010_qa_message.sql
        - classpath:sql/011_study_plan.sql

studyflow:
  jwt:
    secret: test-studyflow-jwt-secret-key-2026-abcdefghijklmnopqrstuvwxyz
    expire-seconds: 7200
    header-name: Authorization
    token-prefix: Bearer 
  upload:
    session-expire-hours: 24
  ai:
    provider: mock
  embedding:
    provider: mock
    mock-dimension: 32
  minio:
    endpoint:
    access-key:
    secret-key:
  rag:
    chunk-size: 200
    chunk-overlap: 40
    top-k: 3
    history-size: 4
  transcription:
    provider: mock
    mock-prefix: "[Mock Transcript]"
