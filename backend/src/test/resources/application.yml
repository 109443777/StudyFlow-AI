spring:
  datasource:
    url: jdbc:h2:mem:studyflow_ai;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/001_user.sql

studyflow:
  jwt:
    secret: test-studyflow-jwt-secret-key-2026-abcdefghijklmnopqrstuvwxyz
    expire-seconds: 7200
    header-name: Authorization
    token-prefix: Bearer 
  minio:
    endpoint:
    access-key:
    secret-key:
