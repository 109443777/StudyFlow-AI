studyflow:
  ai:
    provider: langchain4j
  embedding:
    provider: langchain4j
  langchain4j:
    chat-model: qwen-plus
    embedding-model: text-embedding-v4
    api-key: your-api-key
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    timeout: 30s
    max-retries: 2
    log-requests: false
    log-responses: false

  transcription:
    provider: mock
    mock-prefix: "[Mock Transcript]"
